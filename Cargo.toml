[workspace]
resolver = "2"
members = ["crates/protocol", "crates/ipc", "crates/daemon", "crates/window"]

[workspace.package]
edition = "2021"
version = "2.0.0"
license = "GPL-3.0-or-later"
authors = ["Zach9113"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
