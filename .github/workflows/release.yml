name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libasound2-dev libdbus-1-dev libudev-dev libfontconfig1-dev libfreetype6-dev jq

      - name: Build release tarball
        run: ./scripts/package-release.sh

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.AppImage

  # Windows is an experimental preview: its zip joins the release next to the Linux files (which publish first)
  build-windows:
    needs: build-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows zip
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Keep the zip with the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: windows-experimental
          path: |
            dist/*.zip
            dist/*.zip.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
