name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libasound2-dev libdbus-1-dev libudev-dev libfontconfig1-dev libfreetype6-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  # The Windows-only modules (WASAPI, tray, media keys) are only compiled, and so only linted, on Windows
  check-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The live suites (tests/live*.sh) against a real PipeWire, run headless: its own session bus and sound server, a
  # virtual keyboard (uinput), a virtual MIDI port (ALSA sequencer) and a virtual serial cable. No sound card needed.
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libasound2-dev libdbus-1-dev libudev-dev libfontconfig1-dev libfreetype6-dev \
            pipewire pipewire-pulse wireplumber pulseaudio-utils dbus dbus-user-session python3-gi python3-evdev socat jq curl

      - name: Virtual keyboard and MIDI devices
        run: |
          sudo modprobe uinput && sudo chmod 666 /dev/uinput
          # the ALSA sequencer is in the runner kernel's extra modules, which aren't always published; without it the
          # devices suite skips its MIDI checks
          if sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe snd-seq; then
            sudo chmod 666 /dev/snd/seq
          else
            echo "::warning::no ALSA sequencer on this runner: the MIDI checks are skipped"
          fi
          # the keyboard knob reads /dev/input/event*, which needs the input group
          sudo usermod -aG input "$USER"

      - name: Build
        run: cargo build --release --workspace --examples

      - name: Live suites
        run: |
          fails=0
          for suite in tests/live.sh tests/live_home_assistant.sh tests/live_duck.sh tests/live_dbus.sh \
                       tests/live_devices.sh tests/live_update.sh; do
            echo "::group::$suite"
            # sg: a shell with the input group the usermod above added (this job's session predates it)
            sg input -c "tests/headless_session.sh $suite" || fails=$((fails + 1))
            echo "::endgroup::"
          done
          echo "suites failing: $fails"
          exit "$fails"
